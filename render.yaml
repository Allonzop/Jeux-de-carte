# Déploiement 1-clic sur Render (https://render.com) — supporte les WebSockets.
# 1. Pousse ce repo sur GitHub.
# 2. Sur Render : New > Blueprint, connecte le repo. Render lit ce fichier.
# 3. Render build l'image Docker et te donne une URL publique
#    (ex: https://boloss.onrender.com). Ouvre-la sur 2 appareils pour jouer en 1v1.
services:
  - type: web
    name: boloss
    runtime: docker
    plan: free
    healthCheckPath: /health
